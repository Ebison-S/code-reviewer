# Server
server.port=8080
spring.application.name=lens-api-service

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/lens_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BROKER:localhost:9092}
spring.kafka.consumer.group-id=lens-gateway-group
spring.kafka.consumer.auto-offset-reset=earliest

# GitHub App Configuration (Custom Properties)
github.webhook.secret=${GITHUB_WEBHOOK_SECRET}
github.api.token=${GITHUB_API_TOKEN}