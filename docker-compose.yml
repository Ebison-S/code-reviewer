services:
  mysql:
    image: mysql:8.0
    container_name: lens-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lens_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lens-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    container_name: lens-kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"

  api-service:
    build:
      context: ./api-service
    container_name: lens-api-service
    ports:
      - "8080:8080"
    env_file:                     
      - ./api-service/.env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - KAFKA_BROKER=kafka:9092
      - github.webhook.secret=your_development_webhook_secret_here
      - github.api.token=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
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started

  llm-service:
    build:
      context: ./llm-service
    container_name: lens-llm-service
    env_file:
      - ./llm-service/.env
    environment:
      - KAFKA_BROKER=kafka:9092
      - PYTHONUNBUFFERED=1
    depends_on:
      - kafka